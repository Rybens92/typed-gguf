name: runtime-matrix

# Downloads the PINNED official llama.cpp release asset per platform and runs the oracle's
# live section against it. A job FAILS if the live section skips (that would mean the
# distribution path silently regressed). This is the acceptance harness for SPEC A1 / A6
# and milestone E1a.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  linux-cpu:
    runs-on: ubuntu-24.04
    steps: &steps
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Download the pinned bundle
        run: |
          set -euo pipefail
          ver=$(python3 -c "import re,pathlib;print(re.search(r'LLAMA_TAG = \"(b[0-9]+)\"', pathlib.Path('src/ggufone/runtime/pins.py').read_text()).group(1))" 2>/dev/null || echo b11026)
          curl -fsSL -o runtime.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/${ver}/llama-${ver}-bin-ubuntu-x64.tar.gz"
          mkdir -p /tmp/ggufone-rt && tar xzf runtime.tar.gz --strip-components=1 -C /tmp/ggufone-rt
      - name: Oracle (live, skips are failures)
        run: |
          set -euo pipefail
          out=$(GGUFONE_RUNTIME_DIR=/tmp/ggufone-rt python3 docs/verify_runtime_contract.py)
          echo "$out"
          ! grep -q "SKIP" <<< "$out"

  linux-vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y libvulkan1
      - run: uv sync --extra dev
      - name: Download the pinned Vulkan bundle
        run: |
          set -euo pipefail
          curl -fsSL -o runtime.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/b11026/llama-b11026-bin-ubuntu-vulkan-x64.tar.gz"
          mkdir -p /tmp/ggufone-rt && tar xzf runtime.tar.gz --strip-components=1 -C /tmp/ggufone-rt
      - name: Oracle (live)
        run: |
          set -euo pipefail
          out=$(GGUFONE_RUNTIME_DIR=/tmp/ggufone-rt python3 docs/verify_runtime_contract.py)
          echo "$out"
          ! grep -q "SKIP" <<< "$out"

  windows-cpu:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Download the pinned CPU bundle
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/ggml-org/llama.cpp/releases/download/b11026/llama-b11026-bin-win-cpu-x64.zip" -OutFile runtime.zip
          Expand-Archive -Path runtime.zip -DestinationPath /tmp/ggufone-rt
      # The oracle's live section loads .so paths (linux); Windows runs the doctor smoke
      # once E1a lands: `uv run ggufone init --runtime-dir /tmp/ggufone-rt && uv run ggufone doctor`

  macos-metal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Download the pinned Metal bundle
        run: |
          set -euo pipefail
          curl -fsSL -o runtime.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/b11026/llama-b11026-bin-macos-arm64.tar.gz"
          mkdir -p /tmp/ggufone-rt && tar xzf runtime.tar.gz --strip-components=1 -C /tmp/ggufone-rt
      - name: Doctor smoke (E1a)
        run: uv run ggufone doctor --help

  # A-E2-8: one NON-LINUX job that runs the *engine*, not just the oracle. It downloads the
  # pinned Metal bundle and a 0.5B GGUF, then drives `ggufone bench` end to end (model load ->
  # prefill -> fork readout -> report), including the determinism gate (3 repeats, timings
  # stripped) on this platform. The benchmark itself never downloads anything: the model is a
  # local path and the dev set ships inside the package.
  macos-engine-smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Download the pinned Metal bundle
        run: |
          set -euo pipefail
          curl -fsSL -o runtime.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/b11026/llama-b11026-bin-macos-arm64.tar.gz"
          mkdir -p /tmp/ggufone-rt && tar xzf runtime.tar.gz --strip-components=1 -C /tmp/ggufone-rt
      - name: Small GGUF for the smoke decision (host-side download, not the benchmark's)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/smoke.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          ls -l /tmp/smoke.gguf
      - name: Engine smoke — latency (model load, prefill, decisions)
        run: |
          set -euo pipefail
          GGUFONE_RUNTIME_DIR=/tmp/ggufone-rt uv run ggufone bench --suite latency \
            --model /tmp/smoke.gguf --backend auto --runs 1 --sizes 256 --threads 2 \
            --out /tmp/e2_latency.json --json > /dev/null
          python3 -c "import json;r=json.load(open('/tmp/e2_latency.json'));assert r['suite']=='latency';assert r['model_load']['n']==1;assert r['per_question'],'no decision rows'"
      - name: Engine smoke — results are stable bytes on this platform (A5/A-E2-5)
        run: |
          set -euo pipefail
          GGUFONE_RUNTIME_DIR=/tmp/ggufone-rt uv run ggufone bench --suite determinism \
            --model /tmp/smoke.gguf --backend auto --threads 1 --json > /tmp/e2_determinism.json
          python3 -c "import json;r=json.load(open('/tmp/e2_determinism.json'));row=r['backends'][0];assert r['ok'], r;assert len(set(row['digests']))==1, row['digests']"
      - name: Engine smoke — the dev set answers end to end (A-E2-3 path on macOS)
        run: |
          set -euo pipefail
          GGUFONE_RUNTIME_DIR=/tmp/ggufone-rt uv run ggufone bench --suite quality \
            --model /tmp/smoke.gguf --backend auto --threads 2 --items 6 --json > /tmp/e2_quality.json
          python3 -c "import json;r=json.load(open('/tmp/e2_quality.json'));assert r['overall']['n']==6;assert 0.0<=r['overall']['agreement']<=1.0"
