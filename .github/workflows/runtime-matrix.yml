name: runtime-matrix

# Downloads the PINNED official llama.cpp release asset per platform, then runs the PRODUCT against
# it: the oracle's live section (linux, both bundles), `doctor` + an end-to-end engine and `serve`
# smoke (windows), `bench` + the served TypeSafe path through the real SDK client (macOS). This is
# the acceptance harness for SPEC A1 / A6 and milestone E1a — the jobs are the evidence, so nothing
# here may pass for a reason nobody wrote down (card t_f96fed7f).
#
# SKIPS. Two of the oracle's live checks are *model-absence* skips and cannot run on a runner: run
# 36151935399 failed both linux jobs on `! grep -q "SKIP" <<< "$out"` for exactly that reason.
# `tools/matrix_oracle_skips.py` owns the policy now — those two exact lines are known, and an
# injected third skip fails the job (SPEC A1's "a skip is a failure unless it is named").
#
# WINDOWS, HONESTLY. The first live run (36159785190) proved what `doctor` could not do there:
# `runtime.lock`'s `required_files` are the Linux SONAMEs while the pinned zip ships `llama.dll`,
# `finder.TOOL_NAMES` had no `.exe` leg and the DLL carries no build string — so `runtime.files` /
# `runtime.loadable` failed on a *complete* bundle and `runtime.build` was "unknown" (card
# t_f96fed7f pinned that truth loudly). Card t_8dab8b3a closed it, universally: the distribution
# check renames the lock's roles per platform (`finder.required_files`), `build_number` runs the
# platform's CLI (`llama-cli.exe --version` prints `build 11026`) and the arch pre-flight reads the
# DLL's own ABI decoration (`.?AUgraph@llama_model_qwen2@@`). `tools/matrix_windows_doctor.py`
# pins the closed truth: it fails on any `fail` check, on a distribution check that went back to
# the Linux names, on a build number that was not read — and it REPORTS (never hides) whatever
# this runner still only warns about. The job then proves the parts that DO work on Windows: the
# DLLs load, `bench` measures, and `serve` answers — inline, with SPEC 2.12's named warning,
# because `keep.supported()` is false without AF_UNIX.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  linux-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      - name: Download the pinned bundle
        run: |
          set -euo pipefail
          ver=$(python3 -c "import re,pathlib;print(re.search(r'LLAMA_TAG = \"(b[0-9]+)\"', pathlib.Path('src/typed_gguf/runtime/pins.py').read_text()).group(1))" 2>/dev/null || echo b11026)
          curl -fsSL -o runtime.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/${ver}/llama-${ver}-bin-ubuntu-x64.tar.gz"
          mkdir -p /tmp/typed-gguf-rt && tar xzf runtime.tar.gz --strip-components=1 -C /tmp/typed-gguf-rt
      # Card t_f96fed7f (AC1): the policy is the named filter's, not "any SKIP anywhere is a failure".
      - name: Oracle (live — the two model-absent skips are the only allowed ones)
        run: |
          set -euo pipefail
          out=$(TYPED_GGUF_RUNTIME_DIR=/tmp/typed-gguf-rt python3 docs/verify_runtime_contract.py)
          echo "$out"
          printf '%s\n' "$out" | python3 tools/matrix_oracle_skips.py
      # E2 FIX (card t_31b3943a): a bench placement must survive the loader's degrade ladder on a
      # GPU-less box too — the crash it fixes ("AttributeError: 'Placement' object has no attribute
      # 'kv_type'") happened while the ladder was built, before any device was touched.
      - name: Small GGUF for the placement smoke (host-side download, not the benchmark's)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/smoke.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          ls -l /tmp/smoke.gguf
      - name: Engine smoke — `bench --gpu-layers 4` goes through the loader and reports the placement
        run: |
          set -euo pipefail
          TYPED_GGUF_RUNTIME_DIR=/tmp/typed-gguf-rt uv run typed-gguf bench --suite latency \
            --model /tmp/smoke.gguf --gpu-layers 4 --runs 1 --sizes 256 --threads 2 \
            --json --out /tmp/placement.json > /dev/null
          python3 -c "import json;r=json.load(open('/tmp/placement.json'));p=r['placement'];assert r['model_load']['n']==1,r['model_load'];assert p['requested']=='n_gpu_layers=4',p;assert p['used'] is not None,'the bench row must carry the placement the loader used';assert r['per_question'],'no decision rows'"
      # Card t_31b3943a's step, corrected by t_8dab8b3a. It used to assert `3 placement(s)` on this
      # *bench* row: that count is `fit_oom_probe`'s ladder, while a bench row resolves to the `cpu`
      # backend, which is CPU-PINNED (card t_55de5779) and has no rungs to walk. The assertion had
      # never run either — the fixture predated the CPU-device gate, so the first live execution
      # (job 108153215436) stopped at `E_RUNTIME_SYMBOLS` before any OOM. Both worlds are judged now,
      # each with the count it really has (`tools/matrix_oom_row.py`): the product's row (1 rung,
      # `measured: false`, never `E_INTERNAL`) and the ladder itself (3 rungs to CPU-only).
      - name: Engine smoke — the placement retry answers a typed row, never E_INTERNAL
        run: |
          set -euo pipefail
          mkdir -p /tmp/fake-bundle
          cc -shared -fPIC -O1 -o /tmp/fake-bundle/libllama.so tools/fixtures/fit_oom_bundle.c
          cc -shared -fPIC -O1 -o /tmp/fake-bundle/libggml.so tools/fixtures/fit_oom_bundle.c
          python3 tools/fit_oom_probe.py --make-gguf /tmp/synthetic.gguf
          set +e
          env -u TYPED_GGUF_RUNTIME_DIR TYPED_GGUF_FAKE_OOM_ALL=1 TYPED_GGUF_BENCH_RUNTIME_DIR=/tmp/fake-bundle \
            uv run typed-gguf bench --suite throughput --model /tmp/synthetic.gguf --gpu-layers 4 \
            --runs 1 --json --out /tmp/placement-oom.json > /dev/null
          code=$?
          set -e
          # the ladder world: the same bundle, a full-offload plan — three rungs down to CPU-only
          env -u TYPED_GGUF_RUNTIME_DIR TYPED_GGUF_FAKE_OOM_ALL=1 \
            python3 tools/fit_oom_probe.py --model /tmp/synthetic.gguf --runtime /tmp/fake-bundle \
            --json /tmp/oom-probe.json > /dev/null
          python3 tools/matrix_oom_row.py --bench-row /tmp/placement-oom.json --bench-exit "$code" \
            --probe-receipt /tmp/oom-probe.json --json /tmp/oom-row.json
      # Card t_f96fed7f (AC4): SPEC 2.12's window, measured instead of asserted. `ask` starts a host
      # with a 20 s window, a second `ask` inside it must come back warm (model_load_ms == 0.0, the
      # same pid), and then the host has to exit ON ITS OWN: the tool waits the window out and fails
      # if the record, the socket or the pid is still there. Nothing calls `keep stop` here — that is
      # what makes the claim about the idle unload and not about a stop.
      - name: Warm window — the host a call leaves behind exits by itself (SPEC 2.12)
        run: |
          set -euo pipefail
          TYPED_GGUF_RUNTIME_DIR=/tmp/typed-gguf-rt uv run python tools/matrix_warm_window.py \
            --cli "uv run typed-gguf" --model /tmp/smoke.gguf --keep-alive 20 \
            --json /tmp/warm_window.json

  linux-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y libvulkan1
      - run: uv sync --extra dev
      - name: Download the pinned Vulkan bundle
        run: |
          set -euo pipefail
          curl -fsSL -o runtime.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/b11026/llama-b11026-bin-ubuntu-vulkan-x64.tar.gz"
          mkdir -p /tmp/typed-gguf-rt && tar xzf runtime.tar.gz --strip-components=1 -C /tmp/typed-gguf-rt
      - name: Oracle (live — the same known-skip filter as linux-cpu)
        run: |
          set -euo pipefail
          out=$(TYPED_GGUF_RUNTIME_DIR=/tmp/typed-gguf-rt python3 docs/verify_runtime_contract.py)
          echo "$out"
          printf '%s\n' "$out" | python3 tools/matrix_oracle_skips.py

  # Card t_f96fed7f (AC2): this job used to download a zip and assert nothing ("once E1a lands" —
  # E1a landed long ago, run 36151935399). It now unpacks the pinned win-cpu bundle, proves the DLLs
  # the finder wants are at the bundle root, runs `doctor` against it via TYPED_GGUF_RUNTIME_DIR and
  # pins what it reports, then loads the DLLs for real (`bench`) and boots `serve` for a real HTTP
  # decision — SPEC 2.12's inline fallback, warning included.
  windows-cpu:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      - name: Download the pinned CPU bundle and flatten it (the DLLs the finder wants)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rt = Join-Path $env:RUNNER_TEMP "typed-gguf-rt"
          New-Item -ItemType Directory -Force -Path $rt | Out-Null
          Invoke-WebRequest -Uri "https://github.com/ggml-org/llama.cpp/releases/download/b11026/llama-b11026-bin-win-cpu-x64.zip" -OutFile runtime.zip
          Expand-Archive -Path runtime.zip -DestinationPath $rt -Force
          # The pinned zip unpacks FLAT (checked against the real asset), but a re-pin may nest it the
          # way the linux tarballs are — so flatten when it is nested. The root of
          # TYPED_GGUF_RUNTIME_DIR is where the loader looks (finder.library_names("windows")).
          if (-not (Test-Path (Join-Path $rt "llama.dll"))) {
            $inner = Get-ChildItem -LiteralPath $rt -Directory | Select-Object -First 1
            if ($inner) { Get-ChildItem -LiteralPath $inner.FullName -Force | Move-Item -Destination $rt }
          }
          foreach ($dll in @("llama.dll", "ggml.dll", "ggml-base.dll")) {
            if (-not (Test-Path (Join-Path $rt $dll))) { throw "$dll is missing from $rt" }
          }
          Get-ChildItem -LiteralPath $rt -Filter *.dll | Select-Object -First 8 -ExpandProperty Name
          "TYPED_GGUF_RUNTIME_DIR=$rt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Small GGUF for the smoke decision (host-side download, not the benchmark's)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $model = Join-Path $env:RUNNER_TEMP "smoke.gguf"
          Invoke-WebRequest -Uri "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" -OutFile $model
          Get-Item $model | Select-Object Name, Length
          "TYPED_GGUF_SMOKE_GGUF=$model" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # The Windows truth (t_f96fed7f pinned the gap; t_8dab8b3a closed it): `runtime.files` names
      # the DLLs the zip ships, `runtime.loadable` no longer calls the bundle incomplete,
      # `runtime.build` reads `b11026` out of `llama-cli.exe --version`. The tool fails on any
      # `fail` check, on a distribution check that went back to the Linux names or a build number
      # that was not read, and annotates what this runner still only warns about.
      - name: Doctor — the Windows bundle validates (the distribution check is platform-aware)
        shell: pwsh
        run: uv run python tools/matrix_windows_doctor.py --cli "uv run typed-gguf" --json doctor.json
      - name: Engine smoke — `bench --suite latency` end to end (llama.dll loads and computes)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:RUNNER_TEMP "latency.json"
          uv run typed-gguf bench --suite latency --model $env:TYPED_GGUF_SMOKE_GGUF `
            --backend auto --runs 1 --sizes 256 --threads 2 --json --out $out | Out-Null
          uv run python -c "import json,os,pathlib;r=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'latency.json').read_text(encoding='utf-8'));assert r['suite']=='latency',r['suite'];assert r['model_load']['n']==1,r['model_load'];assert r['per_question'],'no decision rows';print('windows latency ok:',r['wall_ms'],'ms')"
      - name: Serve smoke — a real boot, a real HTTP decision, SPEC 2.12's inline fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $uv = (Get-Command uv).Source
          $log = Join-Path $env:RUNNER_TEMP "serve.log"
          $err = Join-Path $env:RUNNER_TEMP "serve.err"
          # The served routes resolve REGISTRY ALIASES ONLY (SPEC 2.9) and this job downloaded its
          # smoke GGUF by URL, so the registry has to learn about the file before a request names it.
          uv run python tools/matrix_register_model.py --model $env:TYPED_GGUF_SMOKE_GGUF --alias smoke-0.5b --json | Out-Null
          $serve = Start-Process -FilePath $uv -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $err `
            -ArgumentList @("run", "typed-gguf", "serve", "--host", "127.0.0.1", "--port", "8088", "--keep-alive", "600")
          $code = 1
          try {
            uv run python tools/matrix_serve_probe.py --base-url http://127.0.0.1:8088 `
              --model smoke-0.5b --server-log $log --server-log $err --expect inline --json serve_probe.json
            $code = $LASTEXITCODE
          } finally {
            & taskkill /PID $serve.Id /T /F 2>$null | Out-Null
          }
          if ($code -ne 0) { throw "the serve probe failed (exit $code): this platform's served behaviour drifted" }

  macos-metal:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      - name: Download the pinned Metal bundle
        run: |
          set -euo pipefail
          curl -fsSL -o runtime.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/b11026/llama-b11026-bin-macos-arm64.tar.gz"
          mkdir -p /tmp/typed-gguf-rt && tar xzf runtime.tar.gz --strip-components=1 -C /tmp/typed-gguf-rt
      - name: Doctor smoke (E1a)
        run: uv run typed-gguf doctor --help

  # A-E2-8: one NON-LINUX job that runs the *engine*, not just the oracle. It downloads the
  # pinned Metal bundle and a 0.5B GGUF, then drives `typed-gguf bench` end to end (model load ->
  # prefill -> fork readout -> report), including the determinism gate (3 repeats, timings
  # stripped) on this platform. The benchmark itself never downloads anything: the model is a
  # local path and the dev set ships inside the package.
  macos-engine-smoke:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      - name: Download the pinned Metal bundle
        run: |
          set -euo pipefail
          curl -fsSL -o runtime.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/b11026/llama-b11026-bin-macos-arm64.tar.gz"
          mkdir -p /tmp/typed-gguf-rt && tar xzf runtime.tar.gz --strip-components=1 -C /tmp/typed-gguf-rt
      - name: Small GGUF for the smoke decision (host-side download, not the benchmark's)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/smoke.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          ls -l /tmp/smoke.gguf
      - name: Engine smoke — latency (model load, prefill, decisions)
        run: |
          set -euo pipefail
          TYPED_GGUF_RUNTIME_DIR=/tmp/typed-gguf-rt uv run typed-gguf bench --suite latency \
            --model /tmp/smoke.gguf --backend auto --runs 1 --sizes 256 --threads 2 \
            --out /tmp/e2_latency.json --json > /dev/null
          python3 -c "import json;r=json.load(open('/tmp/e2_latency.json'));assert r['suite']=='latency';assert r['model_load']['n']==1;assert r['per_question'],'no decision rows'"
      - name: Engine smoke — results are stable bytes on this platform (A5/A-E2-5)
        run: |
          set -euo pipefail
          TYPED_GGUF_RUNTIME_DIR=/tmp/typed-gguf-rt uv run typed-gguf bench --suite determinism \
            --model /tmp/smoke.gguf --backend auto --threads 1 --json > /tmp/e2_determinism.json
          python3 -c "import json;r=json.load(open('/tmp/e2_determinism.json'));row=r['backends'][0];assert r['ok'], r;assert len(set(row['digests']))==1, row['digests']"
      - name: Engine smoke — the dev set answers end to end (A-E2-3 path on macOS)
        run: |
          set -euo pipefail
          TYPED_GGUF_RUNTIME_DIR=/tmp/typed-gguf-rt uv run typed-gguf bench --suite quality \
            --model /tmp/smoke.gguf --backend auto --threads 2 --items 6 --json > /tmp/e2_quality.json
          python3 -c "import json;r=json.load(open('/tmp/e2_quality.json'));assert r['overall']['n']==6;assert 0.0<=r['overall']['agreement']<=1.0"
      # Card t_f46cec41: the fast preset the GPU-less workers iterate with — the whole campaign
      # (`--quick`, five suites) end to end, with its wall time summed from the reports. The
      # agent container's target is 180 s (tests/test_bench_live.py); the CI guard is deliberately
      # looser (300 s) because a cold macOS runner pays a first-load + first-decode cost this box
      # does not.
      - name: Engine smoke — `bench --quick` end to end (card t_f46cec41)
        run: |
          set -euo pipefail
          for suite in latency throughput quality calibration determinism; do
            TYPED_GGUF_RUNTIME_DIR=/tmp/typed-gguf-rt uv run typed-gguf bench --suite "$suite" --quick \
              --model /tmp/smoke.gguf --backend auto --threads 2 \
              --out "/tmp/quick_${suite}.json" --json > /dev/null
          done
          python3 - <<'PY'
          import json, pathlib
          total = 0.0
          for suite in ("latency", "throughput", "quality", "calibration", "determinism"):
              report = json.loads(pathlib.Path(f"/tmp/quick_{suite}.json").read_text())
              assert report["quick"] is True, suite
              assert report["truncated"] is False, suite
              total += float(report["wall_ms"])
          print(f"quick campaign: {total / 1000:.1f} s")
          assert total <= 300_000, total
          PY
      # Card t_f96fed7f (AC3): the same server, seen by the REAL pinned SDK client — the gate the
      # host-level E2E had locally and CI never had. `serve --keep-alive 600` keeps a host alive for
      # the window, the SDK's own call (model: its hardcoded `jev-latest`, which the server maps to
      # the registry's `current`) goes through the TypeSafe route, the probe then asserts the WARM
      # answer (`served_by=host`, `model_load_ms == 0.0`, the server's own log), and `keep stop` +
      # `keep status` close the ledger cleanly.
      - name: Serve — the pinned SDK client, the warm host, and a clean `keep stop`
        run: |
          set -euo pipefail
          python3 -m venv /tmp/sdk-venv
          /tmp/sdk-venv/bin/pip install --quiet "typesafe-sdk==0.7.1"
          /tmp/sdk-venv/bin/python -c "import typesafe_sdk;assert typesafe_sdk.__version__=='0.7.1',typesafe_sdk.__version__"
          TYPED_GGUF_RUNTIME_DIR=/tmp/typed-gguf-rt uv run python tools/matrix_register_model.py \
            --model /tmp/smoke.gguf --alias smoke-0.5b --json > /tmp/register.json
          TYPED_GGUF_RUNTIME_DIR=/tmp/typed-gguf-rt nohup uv run typed-gguf serve \
            --host 127.0.0.1 --port 8088 --keep-alive 600 > /tmp/serve.log 2>&1 &
          TYPESAFE_API_KEY="typed-gguf-macos-ci" /tmp/sdk-venv/bin/python \
            tools/host_gate_serve_client.py --base-url http://127.0.0.1:8088 --out /tmp/served.json
          TYPED_GGUF_RUNTIME_DIR=/tmp/typed-gguf-rt uv run python tools/matrix_serve_probe.py \
            --base-url http://127.0.0.1:8088 --model smoke-0.5b \
            --server-log /tmp/serve.log --expect host --json /tmp/serve_probe.json
          # The clean stop comes FIRST, while the host is still alive and registered: `keep stop` is
          # the documented tidy path (it clears the ledger), and `keep status` then has to agree.
          TYPED_GGUF_RUNTIME_DIR=/tmp/typed-gguf-rt uv run typed-gguf keep stop --json
          TYPED_GGUF_RUNTIME_DIR=/tmp/typed-gguf-rt uv run python - <<'PY'
          import json, subprocess
          out = subprocess.run(["uv", "run", "typed-gguf", "keep", "status", "--json"],
                               capture_output=True, text=True, check=True)
          report = json.loads(out.stdout)
          assert report["state"] == "stopped", report
          print("keep status after `keep stop`:", report["state"])
          PY
          pkill -f "typed-gguf serve" || true
