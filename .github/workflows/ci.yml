name: ci

# The public gate: ruff + the whole offline suite + the engine oracle, on a runner with no model,
# no GPU and no runtime bundle. The dev extra is the only thing installed; nothing here downloads
# a model or a bundle, and the suite runs with the network switched off at the Python level
# (`TYPED_GGUF_TEST_BLOCK_NET=1` — `tests/conftest.py` replaces `socket.socket`,
# `socket.create_connection` and `socket.getaddrinfo` with a function that raises, so a decision
# path that reaches for the network fails this job instead of quietly passing).
#
# The live acceptance harness (`runtime-matrix.yml`) is manual/scheduled and deliberately NOT part
# of this trigger surface: it is the one workflow that downloads the pinned bundle and a small GGUF.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: offline gate (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    # the whole job is ~1 min (sync + 24 s suite + oracle); a hung runner must not burn 6 h
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 measured clean on this tree before it was put here: 1331 passed / 48 skipped, the
        # same counts as 3.11 (card t_44c85f68).
        python-version: ["3.11", "3.12"]
    env:
      # one interpreter for every `uv` invocation in the job (sync, lint, suite, oracle)
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: uv (with caching)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync (dev extra)
        run: uv sync --extra dev

      - name: Lint
        run: |
          set -euo pipefail
          # The repo's own code gate (docs/evidence/e1a_qa.md: `ruff check src tests tools docs`).
          # Not `ruff check .`: the committed dev-run receipts under `.e2e/`, `.e3*/`, `.t7c9/`,
          # `.t9bcb/` are cited by `docs/` and stay tracked, and a scratch receipt must never be
          # able to turn the public gate red.
          env -u PYTHONPATH uv run --extra dev ruff check src tests tools docs .github

      - name: Offline bench bundle stub (no download — one gate selects a backend)
        run: |
          set -euo pipefail
          # `tests/test_bench_prompt_parity.py::test_a_row_records_which_framing_it_measured`
          # drives the *fake* engine (`tests/fake_engine.py`) but still goes through
          # `harness.backend_runtimes`, so it needs a *visible* bundle to select `cpu` from.
          # These four files are empty and nothing ever dlopens them
          # (`runtime.finder.backend_of_bundle` classifies a bundle by its library *names*); on a
          # bundle-free runner the test fails without this stub (measured: 1 failed / 1330 passed /
          # 48 skipped instead of 1331 / 0 / 48).
          bundle="$RUNNER_TEMP/typed-gguf-offline-bundle"
          mkdir -p "$bundle"
          for lib in libllama.so libggml.so libggml-base.so libggml-cpu.so; do
            : > "$bundle/$lib"
          done

      - name: Offline suite (no model, no bundle, no network — the live gates skip)
        run: |
          set -euo pipefail
          # The card's local convention (`env -u PYTHONPATH uv run --extra dev pytest`) plus the
          # repo's own net-off flag. `-rs` prints every skip with its reason, so the log states the
          # skip counts the run really had instead of only its totals.
          log="$RUNNER_TEMP/pytest-offline.log"
          env -u PYTHONPATH TYPED_GGUF_TEST_BLOCK_NET=1 \
            TYPED_GGUF_BENCH_RUNTIME_DIR="$RUNNER_TEMP/typed-gguf-offline-bundle" \
            uv run --extra dev pytest -q -rs --timeout=120 2>&1 | tee "$log"
          echo "offline suite: $(tail -n 1 "$log")"
          grep -qE "[0-9]+ passed" "$log"
          ! grep -qE "[0-9]+ (failed|error)" "$log"

      - name: "Live gates must skip, never fail (the red path: TYPED_GGUF_RUNTIME_DIR unset)"
        run: |
          set -euo pipefail
          # Hard rule: nothing here may need a bundle or a model. With both runtime variables
          # unset the live set is *collected* and *skipped* — never failed.
          out=$(env -u PYTHONPATH -u TYPED_GGUF_RUNTIME_DIR -u TYPED_GGUF_BENCH_RUNTIME_DIR \
                uv run --extra dev pytest -q -m "model or network")
          echo "$out"
          grep -q "skipped" <<<"$out"
          ! grep -qE "[0-9]+ (failed|error)" <<<"$out"

      - name: Engine oracle (offline pins — sections B and the local-model pin in C skip)
        run: |
          set -euo pipefail
          out=$(env -u PYTHONPATH uv run --extra dev python docs/verify_runtime_contract.py)
          echo "$out"
          grep -q "^failures: 0" <<<"$out"
          # The bundle-free shape runs [A], [C] (minus its local-model header pin) and [D]; only
          # [B] live probes and the absent local Spark GGUF may skip, and each prints its reason
          # above. Any other skip (e.g. [D] skipping because `typed-gguf` did not import) is a
          # regression this step must not swallow.
          unexpected=$(grep "^  SKIP" <<<"$out" | grep -Ev "no runtime installed|local Spark GGUF absent" || true)
          if [ -n "$unexpected" ]; then
            echo "unexpected offline skip(s) — the oracle skipped more than the bundle-free shape:"
            echo "$unexpected"
            exit 1
          fi
