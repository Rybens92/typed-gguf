[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ggufone"
version = "0.1.0"
description = "GGUF-native typed decision engine: state + typed questions -> typed answers with probabilities, on frozen models (no fine-tuning, no text generation)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ggufone contributors" }]
keywords = ["gguf", "llama.cpp", "decisions", "llm", "local"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Hard rule: the core engine has ZERO third-party runtime dependencies (stdlib only).
# cf. SPEC.md 2.11 ("no fine-tuning guarantee") and A2/A7.
dependencies = []

[project.optional-dependencies]
# accelerated HuggingFace downloads (Xet / hf_transfer); download works without it
network = ["hf_transfer>=0.1.6"]
# optional compatibility runtime backend (degraded: no spark2_5, no Vulkan wheels, no fit)
llamacpp = ["llama-cpp-python>=0.3.16"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.6"]

[project.scripts]
# the console script uses the *process* entry point: a command that dlopened a bundle ends the
# process itself, so its exit status is the command's code and never a third-party destructor's
# signal (`ggufone.cli.run`, card t_97f1bc93)
ggufone = "ggufone.cli:run"

[project.urls]
Homepage = "https://github.com/Rybens92/ggufone"

[tool.hatch.build.targets.wheel]
packages = ["src/ggufone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# E1a: the gate is `uv run pytest -q`. Do not pin `-q` here — a second `-q` on the command
# line would make it `-qq` and swallow the "N passed, M skipped" summary the reviewer reads.
# The package is importable from the checkout without an installed dist (the venv may only
# carry the editable install via .pth).
pythonpath = ["src"]
markers = [
  "network: needs network (skipped unless --run-network is passed)",
  "model: needs a real GGUF model on disk (skipped unless --run-network is passed)",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/evidence/ holds captured third-party artifacts (e.g. the operator's PoC). Frozen
# evidence, not our code: it is pinned by the oracle and never edited.
exclude = ["docs/evidence", "state", ".venv", "mutants", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# the oracle mirrors reference implementations in one long, readable script
"docs/verify_runtime_contract.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mutmut]
# Mutation testing (Tier M). `source_paths` lists the *files under mutation*; `also_copy` brings
# the rest of the package (plus tests/docs/tools) into the mutants tree verbatim, so the copied
# package still imports while only those files carry mutants. Swap the pair for a wider sweep —
# e.g. source_paths = ["src/ggufone"] with also_copy = ["tests", ...] — when a milestone wants
# the whole package (E1a/E1b did: readout + schema).
# Card t_8cb0a05e (E1c FIX) swept `source_paths = ["src/ggufone/runtime/fit.py"]` with
# [tests/test_fit.py, tests/test_fit_free_vram.py, tests/test_fit_oom_recovery.py] and
# max_children = 2 (the fast set, so a sweep finishes inside the shared pid cap).
# Card t_858c54d1 (E2) retargets the pair below at the bench package with the bench gates.
# Card t_630f32a3 (E2.5) swept `source_paths = ["src/ggufone/calibration"]` with both calibration
# gate files and max_children = 3 (3 crashed the container's pid cap at 1726/2728 mutants; the
# completed sweep ran with 2, which is what stays here). Card t_e29734e6 (E1c FIX) is a
# *test-only* change (no production line moved), so its sweep was the fit pair again —
# time-boxed on a box shared with a sibling benchmark, so the score is reported with its not-run
# count, never as a full-sweep number. Card t_603a35a0 (E2 FIX, backend attribution) swept the
# new parser alone — src/ggufone/runtime/devices.py with tests/test_bench_attribution.py —
# because that module *is* the fix's evidence rule and the bench gates are too slow to run per
# mutant on this shared box. Card t_dd62ec29 (E2 FIX, the mixed-bundle teardown abort) swept
# src/ggufone/bench/isolation.py with tests/test_bench_isolation.py, because that module is the
# whole remedy (the suites only call into it) and its gate file is fast. Restore a
# bench/fit/resolver sweep by swapping both lines back.
# Card t_a431be85 (E3) swept `source_paths = ["src/ggufone/bench/compare.py"]` with
# [tests/test_e3.py] — the module E3 adds (align / merge_reports / model_row / render_comparison);
# its gate file is fast and drives every branch of it, which is what a Tier-M sweep needs on a box
# shared with a sibling bench. Card t_57cc0179 (E2 FIX, the teardown crash's recovery) is the most
# recent sweep and takes `source_paths` back to `src/ggufone/bench/isolation.py` with both of that
# module's gate files (see the test-selection comment below).
source_paths = ["src/ggufone/bench/isolation.py"]
also_copy = ["src/ggufone", "tests", "docs", "tools", "runtime.lock", "pyproject.toml", "README.md",
             "SPEC.md", "LICENSE"]
pytest_add_cli_args = ["-q", "--timeout=120", "-p", "no:randomly"]
# E1c FIX (card t_8cb0a05e) used [tests/test_fit.py, tests/test_fit_free_vram.py,
# tests/test_fit_oom_recovery.py] with max_children = 2 (the fast set, so a sweep can finish
# inside this container's shared pid cap). E2 (card t_858c54d1) mutates the bench package, whose
# gate files are tests/test_bench.py (the suite/report contract), tests/test_bench_placement.py
# (card t_31b3943a: the bench<->loader seam) and tests/test_bench_quick.py (card t_f46cec41: the
# `--quick` preset, the soft cap and report integrity — a CLI-level test cannot kill a bench
# mutant: it drives a different module). E2.5 (card t_630f32a3) mutates the calibration package:
# both of its gate files are the selection (test_calibration.py drives the math/fit/store/CLI,
# test_routing.py the router and the escalation policy). Card t_e29734e6 (E1c FIX, test-only)
# swept the fit files again. Card t_603a35a0 (E2 FIX, backend attribution) swept
# src/ggufone/runtime/devices.py with tests/test_bench_attribution.py. Card t_dd62ec29 (E2 FIX,
# mixed-bundle teardown) swept that module with tests/test_bench_isolation.py. Card t_a431be85 (E3)
# activated `["src/ggufone/bench/compare.py"]` + `["tests/test_e3.py"]` while it landed; card
# t_57cc0179 (E2 FIX, the teardown crash's recovery) is the most recent sweep and puts the pair back
# on the module it changes — `src/ggufone/bench/isolation.py` with **both** isolation gate files
# (test_bench_isolation.py = the containment, test_bench_teardown_crash.py = the retry, the warning
# and the table): the retry lives inside `run_backend_child`, whose mutants only the pair together
# kill. A bench sweep only has to restore the three bench gate files above; an E3 sweep restores
# `compare.py` + `test_e3.py`.
pytest_add_cli_args_test_selection = ["tests/test_bench_isolation.py",
                                      "tests/test_bench_teardown_crash.py"]
# NOT read by mutmut 3.8 (it is a CLI-only option: `mutmut run --max-children 2`), and a sweep on
# this box needs both the flag and a retry driver: a failed `os.fork()` takes the whole run down
# with `BlockingIOError: [Errno 11]`. `.e2e/t_57cc0179-vulkan-teardown/mutmut_sweep.sh` does both.
