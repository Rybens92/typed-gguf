# `value_verdict` composes. **Deliberately not swept: `engine/decide.py`** — the value-row walk
# (`_score_group`, the one-token continuation, the two new warnings) is gated by the same file, but
# decide.py is 44 KB of engine the E3e change touches in one method, and mutating it would multiply
# the sweep by every wave/coverage/readout branch the E3e gates never reach on this shared box. A
# later card that adds an engine-shaped change restores a decide.py sweep.
# Card t_c8c76cc8 (E3e audit, F1-F4 applied verbatim) moves the pair to the *tool* the findings live
# in: `tools/e3e_roles_decision.py` — the freeze check's compared field set (F1, `cue.refused`) and
# `decide()`'s fallback verdict (F2). Its own gate file is the whole selection;
# `tests/test_e3e_docs.py` is deliberately out (its pins are prose, and a doc edit cannot kill a
# mutant). Restore the engine pair above when an engine card sweeps next.
# The sweep: 1941 mutants, two rounds against the same source (the change, then the pin round 1's
# survivors named). Round 1: 1404 killed / 537 survived (72.3 %) — the F1 hunk 22/22 killed, the F2
# hunk 12 killed / 2 survived (the new branches' verdict dict `label` key, which nothing rendered).
# Round 2 adds `test_the_report_prints_the_new_fallback_wording`: 1412 killed / 529 survived
# (72.7 %), F1 22/22 and F2 14/14 killed. The two survivors on the changed surface are casing
# mutants of the F3 caveat literal (prose; the note's `1.96` content is pinned). Receipts:
# `docs/evidence/e3e/logs/f1_f4_patches.txt`, `docs/evidence/e3e/logs/mutmut_f1f4.log`, `docs/evidence/e3e/mutmut_f1f4_triage.txt`.
# `tests/test_e3e_roles_decision.py` had to load the tool under its path-derived name for any of
# this to run — mutmut keys a trampoline by the path, not by a bare module name (see `_tool()`).
# Card t_eff926f9 (v0.1.0 FIX, the packaged lock) takes the pair to the module the fix moves:
# `src/typed_gguf/runtime/pins.py` — the lookup order (`lock_candidates` / `located_lock`), the
# packaged-copy path and the search list the `E_RUNTIME_MISSING` text renders. Its own gate file is
# the selection: the injection points (`package_file=` / `cwd=` / `environ=`) drive every branch of
# the new chain on a shape built on disk, so the sweep stays fast on this shared box. Restore a
# tool/engine pair above when the next card sweeps one.
#
# The sweep (driver: `docs/evidence/e2e/t_57cc0179-vulkan-teardown/mutmut_sweep.sh`, `--max-children 2`, two
# rounds because round 1's survivors on the new surface earned six new pins): 421 mutants both
# times, **344/421 = 81.7% killed** in round 2, and round 2's verdicts differ from round 1's in
# exactly those six keys (survived → killed) — every other verdict is identical, which is the
# stability check this pid-capped box needs. The 77 survivors are pre-existing host-mapping rows
# (their gates live in other files), casing/padding in the `E_RUNTIME_MISSING` prose and type
# mutants in the `load_lock` parse body: none on this card's surface. Receipts and the triage:
# `docs/evidence/v0_1_0_t_eff926f9_uvx_install.md`.
# Card t_7e24cea4 (E4, the warm engine host — SPEC 2.12) takes the pair to the package the card
# adds: `src/typed_gguf/keep` — identity (the key, the duration chain), state (the ledger and its
# liveness rules), host (the socket server, the idle clock, the teardown discipline) and client
# (spawn, reuse, swap, orphan cleanup, the reporting verbs). The selection is the card's four
# offline gate files: test_keep.py (pure arithmetic and file bookkeeping), test_keep_host.py
# (drives the production Server in-process), test_keep_client.py (spawns the production server
# around a stand-in engine, tests/fake_keep_host.py, so the spawn/reuse/swap/cleanup policy is
# measured instead of mocked) and test_keep_cli.py (the CLI's half, by injection — which is also
# why `cli.py` is NOT in source_paths: mutating 44 KB of command surface would multiply the sweep
# for wiring those four files already drive end to end). `tests/test_keep_live.py` is deliberately
# not selected: it wants the real 4B, the Vulkan bundle and ~5 minutes, and it skips without
# `--run-network` anyway.
#
# The sweep (driver: `docs/evidence/e2e/t_7e24cea4-warm-host/mutmut_sweep.sh`, `--max-children 2`): 2176 mutants.
# Round 1 (before the new pins) 1391/2176 killed by exit code — which is 1310 *real* kills plus the
# 75 mutants mutmut put in its own "no tests" bucket (uncovered lines), 5 timeouts and 1 suspicious.
# Those 75 were the finding: they pointed at `host.Server._fail` (45), `state.wait_pid_gone` (15),
# `client._listening` (14) and one `HostRecord.replace`. Six pins closed them (the exact
# `describe()` line, the `_listening` probe, `wait_pid_gone`, stop-of-a-foreign-host + its SIGKILL
# escalation, and the failed-record path), and one of the pins exposed a product bug: `_fail` passed
# `state=` where `_write_record` takes `record_state=`, so the `TypeError` was swallowed and a host
# that could not load left no diagnosis (the `record.state == "failed"` branch in `client.py` was
# dead code). Round 2 (scoped re-run of the five named groups) 1424/2176 = 65.4% killed, 752
# survived, 0 uncovered; the five groups went 44/210 → 151/210. Survivors are equivalent mutants on
# reporting paths (rounding, `suppress` guards, wait constants) and cross-process wire behaviour the
# offline selection cannot see (it is covered by `tests/test_keep_live.py`, deliberately not
# selected). Receipts and the full triage: `docs/evidence/v0_1_0_t_7e24cea4_warm_host.md` §4.
# Card t_176614c6 (FIX, the UX trio) retargeted the pair for one Tier-M run at the module it
# changes — `source_paths = ["src/typed_gguf/keep/client.py"]` with
# `pytest_add_cli_args_test_selection = ["tests/test_keep_client.py"]`, `--max-children 2`, driver
# `docs/evidence/e2e/t_176614c6-live/mutmut_sweep.sh` (that file carries the retargeted pair; the values here are
# this repo's standing pair, restored after the run): 829 mutants, **506 killed = 61.0 %**, 317
# survived, 6 timeouts, 0 in the "no tests" bucket. The selection is one of the module's four gate
# files, so most survivors are behaviour the *other* three assert (report strings, `child`-handle
