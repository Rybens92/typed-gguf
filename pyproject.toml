# loop mutants that hang the socketpair gate (mutmut books those as timeouts). Driver:
# `tools/mutmut_driver.py run --max-children 2` (mutmut 3.8 caches verdicts in
# `mutants/mutmut-stats.json`; a second full `run` reprints them at 0.00 mutations/second, so
# round 2 went through `run '<key>*'`). Receipts: `docs/evidence/t_f5d8b6c7_serve_gates.md` §5.
# Card t_d88b4be0 (`runtime update|rollback`, SPEC 2.8) retargets the pair at the module the card
# adds: `src/typed_gguf/runtime/update.py` — resolution, the release list, the retag rule, staging,
# the staged-bundle verdicts, the switch and the record rewrite — with its own gate file as the
# whole selection (`tests/test_runtime_update.py` drives every branch on fake bundles, offline).
# `cli.py` is deliberately not in `source_paths`: the `runtime` subcommand is thin wiring those
# gates already drive end to end. Restore the serve/api pair above when a serve card sweeps next.
source_paths = ["src/typed_gguf/runtime/update.py"]
# Card t_f5d8b6c7 (serve) drops `docs` from also_copy for this sweep: the selection
# (`tests/test_serve.py`) reads no document, while `docs/evidence/` carries 4.3 GB of committed
# e2e artifacts (a model tree, two venvs with dangling `bin/python*` links) whose copy dominated
# the run and aborted it on this container. A sweep whose gate file reads `docs/` must put it back.
also_copy = ["src/typed_gguf", "tests", "tools", "runtime.lock", "pyproject.toml", "README.md",
             "SPEC.md", "LICENSE"]
pytest_add_cli_args = ["-q", "--timeout=120", "-p", "no:randomly"]
# E1c FIX (card t_8cb0a05e) used [tests/test_fit.py, tests/test_fit_free_vram.py,
# tests/test_fit_oom_recovery.py] with max_children = 2 (the fast set, so a sweep can finish
# inside this container's shared pid cap). E2 (card t_858c54d1) mutates the bench package, whose
# gate files are tests/test_bench.py (the suite/report contract), tests/test_bench_placement.py
# (card t_31b3943a: the bench<->loader seam) and tests/test_bench_quick.py (card t_f46cec41: the
# `--quick` preset, the soft cap and report integrity — a CLI-level test cannot kill a bench
# mutant: it drives a different module). E2.5 (card t_630f32a3) mutates the calibration package:
# both of its gate files are the selection (test_calibration.py drives the math/fit/store/CLI,
# test_routing.py the router and the escalation policy). Card t_e29734e6 (E1c FIX, test-only)
# swept the fit files again. Card t_603a35a0 (E2 FIX, backend attribution) swept
# src/typed_gguf/runtime/devices.py with tests/test_bench_attribution.py. Card t_dd62ec29 (E2 FIX,
# mixed-bundle teardown) swept that module with tests/test_bench_isolation.py. Card t_a431be85 (E3)
# activated `["src/typed_gguf/bench/compare.py"]` + `["tests/test_e3.py"]` while it landed; card
# t_57cc0179 (E2 FIX, the teardown crash's recovery) is the most recent sweep and puts the pair back
# on the module it changes — `src/typed_gguf/bench/isolation.py` with **both** isolation gate files
# (test_bench_isolation.py = the containment, test_bench_teardown_crash.py = the retry, the warning
# and the table): the retry lives inside `run_backend_child`, whose mutants only the pair together
# kill. A bench sweep only has to restore the three bench gate files above; an E3 sweep restores
# `compare.py` + `test_e3.py`. Card t_6952f0dd (E3b, the `qwen35moe` label policy) activates
# `["src/typed_gguf/bench/labels.py"]` + `["tests/test_e3b_labels.py"]`; a later sweep restores this
# Card t_d90404ac (E3d, the cue shapes + the `--cue` switch) moves the pair to the module the change
# rewrites — `src/typed_gguf/engine/prompt.py`: `build_question(cue=...)` renders `two_step`
# byte-for-byte the same suffix and `json_field` as the cue line plus the per-type opener, and the
# byte-identity is exactly the mutant only the card's own gate file kills
# (tests/test_e3d_cue_switch.py, with the template/framing gates and the E1c pins beside it).
#
# The sweep: 149 mutants, **74 killed / 50 survived / 25 no-tests**, 0 timeouts. The survivors are
# the module's pre-existing branches (the descriptions/readout paths of `build_question`) that this
# selection does not drive, and the no-tests block is `empty_candidate_code`, whose gates live in
# the CLI suites. Widening the selection to `tests/test_e3b_labels.py` + `tests/test_scaffold.py`
# to reach them is *recorded as attempted and not achieved*: on mutmut 3.8 that run reported the
# mutant phase as passing-without-failing (0 killed / 50 survived) rather than aborting, i.e. the
# tests no longer saw the mutations at all. The trigger was an environment one, not the selection:
# `uv run --with mutmut` re-syncs the project venv, and without `--extra dev` that drops pytest, so
# the baseline run dies (every mutant reads "not checked"); after `uv sync --frozen --extra dev`
# restores it, the same 149 mutants all read "survived", which is why the driver carries `--extra
# dev` now and why the numbers above are the only ones this card stands behind. A later sweep should
# rebuild the venv the way this run had it before widening the selection. The
# cue-verdict pair above (cue.py + the three e3c gate files) stays valid for the module it names;
# restore it when a cue-verdict card sweeps next.
# isolation pair. Card t_635124bf (E3c FIX, the cue verdict classifies the vocabulary) keeps
# `source_paths` on the same module — it is the file the fix moves — and adds the card's own gate
# file to the selection: the map's fallbacks (`<special <id>>`, the catalogue winning a collision,
# the session that cannot enumerate) and the dominance floor live only in
# `tests/test_e3c_cue_specials.py`, so a two-file selection would leave those mutants alive.
# Card t_6de5fc53: the parity gate the fix exists for, plus the five `tests/test_bench.py` nodes
# that drive the changed helpers (the quality rows, the renderer's framing line and the table
# integrity). The other bench gates spawn real files, sessions or models and cannot run per mutant
# on this shared box.
# Card t_c8c76cc8 (E3e audit F1-F4) selects the tool's own gate file: it drives the freeze check's
# field set and every branch of the new verdict wording, and it is fast enough to run per mutant.
# Card t_eff926f9 selects `tests/test_pins.py` alone — see its paragraph at `source_paths`.
# **Deliberately not selected: `tests/test_wheel_install.py`** — the artifact gate (uv build +
# uv tool install + three CLI runs ≈ 7 s per run) would multiply the sweep by a build per mutant;
# the surface it guards is the one `test_pins.py` drives through injection, and two hand probes of
# the packaged-path mutants against that file are recorded in
# `docs/evidence/v0_1_0_t_eff926f9_uvx_install.md`.
# Card t_ca1d4231 (context sizing v2) takes the pair to the module the card rewrites —
# `src/typed_gguf/runtime/fit.py`: the policy (`estimate_plan` / `policy_target` /
# `replan_for_host`), the SWA-aware `kv_bytes` and the binary bridge's `ctx_limit`. Selection: the
