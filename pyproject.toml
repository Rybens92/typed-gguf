# has no behavioural survivor. See `docs/qa/t_176614c6-ux-trio.qa.md`.
# Card t_f5d8b6c7 (serve) retargets the pair at the module the card adds —
# `src/typed_gguf/api/http.py`, the whole TypeSafe/native HTTP surface — with its own gate file
# `tests/test_serve.py` (62 tests: wire, mapping, errors, same-engine, cold/warm over the fake keep
# host, the docs pins, and the host gate's own driver). Sweep: **747 mutants, 494 killed = 66.1 %**
# in round 1 (214 survived, 26 timeouts, 13 "no tests"); round 2 added four exact-value pins
# (`_human_size`, `_release_date`, `_location_for`, `run()`'s lifecycle) and a scoped re-run of the
