[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typed-gguf"
version = "0.2.3"
description = "Local alternative to Jev: typed decisions (choice/score/yes-no) with real probability distributions from any llama.cpp-supported GGUF model, and an easy CLI for humans and AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "typed-gguf contributors" }]
keywords = ["gguf", "llama.cpp", "decisions", "llm", "local"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Hard rule: the core engine has ZERO third-party runtime dependencies (stdlib only).
# cf. SPEC.md 2.11 ("no fine-tuning guarantee") and A2/A7.
dependencies = []

[project.optional-dependencies]
# accelerated HuggingFace downloads (Xet / hf_transfer); download works without it
network = ["hf_transfer>=0.1.6"]
# optional compatibility runtime backend (degraded: no spark2_5, no Vulkan wheels, no fit)
llamacpp = ["llama-cpp-python>=0.3.16"]
# PyYAML is the *gate's* parser, not the tool's: `tests/test_release_publish.py` reads
# `.github/workflows/publish.yml` through it, because a release workflow that does not parse is a
# release that cannot happen (card t_6027fb77). The packaged engine still has zero third-party
# runtime dependencies (see `dependencies` above).
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.6", "pyyaml>=6.0"]

[project.scripts]
# the console script uses the *process* entry point: a command that dlopened a bundle ends the
# process itself, so its exit status is the command's code and never a third-party destructor's
# signal (`typed_gguf.cli.run`, card t_97f1bc93)
typed-gguf = "typed_gguf.cli:run"

[project.urls]
Homepage = "https://github.com/Rybens92/typed-gguf"

[tool.hatch.build.targets.wheel]
packages = ["src/typed_gguf"]
# `runtime.lock` is data (repo root, the one committed copy — SPEC 4) and a wheel has to carry it:
# an out-of-tree install (`uvx --from …`, `uv tool install`, pip into a plain venv) has no
# repository above `typed_gguf/`, so `pins.load_lock()` would find nothing and every command would
# answer E_RUNTIME_MISSING (card t_eff926f9). force-include puts the root file inside the wheel at
# build time — same source, no second copy in the tree, nothing that can drift. The destination is
# `pins.PACKAGED_LOCK_RELATIVE`; `tests/test_pins.py` and `tests/test_wheel_install.py` pin the two
# together (the second one byte-for-byte, on the artifact).
force-include = { "runtime.lock" = "typed_gguf/data/runtime.lock" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# E1a: the gate is `uv run pytest -q`. Do not pin `-q` here — a second `-q` on the command
# line would make it `-qq` and swallow the "N passed, M skipped" summary the reviewer reads.
# The package is importable from the checkout without an installed dist (the venv may only
# carry the editable install via .pth).
pythonpath = ["src"]
markers = [
  "network: needs network (skipped unless --run-network is passed)",
  "model: needs a real GGUF model on disk (skipped unless --run-network is passed)",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/evidence/ holds captured third-party artifacts (e.g. the operator's PoC). Frozen
# evidence, not our code: it is pinned by the oracle and never edited.
exclude = ["docs/evidence", "state", ".venv", "mutants", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# the oracle mirrors reference implementations in one long, readable script
"docs/verify_runtime_contract.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mutmut]
# Mutation testing (Tier M). `source_paths` lists the *files under mutation*; `also_copy` brings
# the rest of the package (plus tests/docs/tools) into the mutants tree verbatim, so the copied
# package still imports while only those files carry mutants. Swap the pair for a wider sweep —
# e.g. source_paths = ["src/typed_gguf"] with also_copy = ["tests", ...] — when a milestone wants
# the whole package (E1a/E1b did: readout + schema).
# Card t_8cb0a05e (E1c FIX) swept `source_paths = ["src/typed_gguf/runtime/fit.py"]` with
# [tests/test_fit.py, tests/test_fit_free_vram.py, tests/test_fit_oom_recovery.py] and
# max_children = 2 (the fast set, so a sweep finishes inside the shared pid cap).
# Card t_858c54d1 (E2) retargets the pair below at the bench package with the bench gates.
# Card t_630f32a3 (E2.5) swept `source_paths = ["src/typed_gguf/calibration"]` with both calibration
# gate files and max_children = 3 (3 crashed the container's pid cap at 1726/2728 mutants; the
# completed sweep ran with 2, which is what stays here). Card t_e29734e6 (E1c FIX) is a
# *test-only* change (no production line moved), so its sweep was the fit pair again —
# time-boxed on a box shared with a sibling benchmark, so the score is reported with its not-run
# count, never as a full-sweep number. Card t_603a35a0 (E2 FIX, backend attribution) swept the
# new parser alone — src/typed_gguf/runtime/devices.py with tests/test_bench_attribution.py —
# because that module *is* the fix's evidence rule and the bench gates are too slow to run per
# mutant on this shared box. Card t_dd62ec29 (E2 FIX, the mixed-bundle teardown abort) swept
# src/typed_gguf/bench/isolation.py with tests/test_bench_isolation.py, because that module is the
# whole remedy (the suites only call into it) and its gate file is fast. Restore a
# bench/fit/resolver sweep by swapping both lines back.
# Card t_a431be85 (E3) swept `source_paths = ["src/typed_gguf/bench/compare.py"]` with
# [tests/test_e3.py] — the module E3 adds (align / merge_reports / model_row / render_comparison);
# its gate file is fast and drives every branch of it, which is what a Tier-M sweep needs on a box
# shared with a sibling bench. Card t_57cc0179 (E2 FIX, the teardown crash's recovery) took
# `source_paths` to `src/typed_gguf/bench/isolation.py` with both of that module's gate files (see the
# test-selection comment below); card t_6952f0dd (E3b, the label policy) is the current sweep and
# mutates `src/typed_gguf/bench/labels.py` — a later sweep restores the isolation pair.
# Card t_6c119626 (E3c, the cue verdict + the shape probe) takes the pair to the module the change
# adds: `src/typed_gguf/engine/cue.py` — the refusal rule (`cue_verdict`, `single_token_closers`,
# `closer_mass`) that `decide.py` and the report both call — with the card's two gate files. The
# doc gate in test_e3c_cue_refused.py reads the same module's closer vocabulary, so it is part of
# the selection. Restore the bench pair above when a bench card sweeps next.
# Card t_6de5fc53 (the bench/product prompt-parity fix) takes `source_paths` to the module the fix
# moves: `src/typed_gguf/bench/harness.py` — `LiveModel.decide` plans once from the handle now, and
# `framing_label` / `framing_line` / `prefix_tokens_of` / `device_cell` / `evidence_line` carry the
# framing into every row and into the rendered report. `suites.py` is deliberately *not* added: its
# change is three dict entries that the same gate nodes read, while mutating the whole module would
# multiply the sweep by suite bodies the parity pair never reaches.
# Card t_4c48f40a (E3e, the question's placement + the instructed JSON) is the current sweep. It
# takes `source_paths` to the two modules the card's *prompt* half lives in: `engine/prompt.py`
# (the role split, the two framings, the contract lines, the acceptance) and `engine/cue.py` (the
# value row's verdict vocabulary: `value_markers`, `value_verdict`). The card's gate files are the
# selection — `tests/test_e3e_roles.py` drives every new branch (including the model-marked family
# checks, which skip without `--run-network` and therefore do not slow the sweep), the E3d pin file
