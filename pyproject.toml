[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ggufone"
version = "0.1.0"
description = "GGUF-native typed decision engine: state + typed questions -> typed answers with probabilities, on frozen models (no fine-tuning, no text generation)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ggufone contributors" }]
keywords = ["gguf", "llama.cpp", "decisions", "llm", "local"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Hard rule: the core engine has ZERO third-party runtime dependencies (stdlib only).
# cf. SPEC.md 2.11 ("no fine-tuning guarantee") and A2/A7.
dependencies = []

[project.optional-dependencies]
# accelerated HuggingFace downloads (Xet / hf_transfer); download works without it
network = ["hf_transfer>=0.1.6"]
# optional compatibility runtime backend (degraded: no spark2_5, no Vulkan wheels, no fit)
llamacpp = ["llama-cpp-python>=0.3.16"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.6"]

[project.scripts]
# the console script uses the *process* entry point: a command that dlopened a bundle ends the
# process itself, so its exit status is the command's code and never a third-party destructor's
# signal (`ggufone.cli.run`, card t_97f1bc93)
ggufone = "ggufone.cli:run"

[project.urls]
Homepage = "https://github.com/Rybens92/ggufone"

[tool.hatch.build.targets.wheel]
packages = ["src/ggufone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# E1a: the gate is `uv run pytest -q`. Do not pin `-q` here — a second `-q` on the command
# line would make it `-qq` and swallow the "N passed, M skipped" summary the reviewer reads.
# The package is importable from the checkout without an installed dist (the venv may only
# carry the editable install via .pth).
pythonpath = ["src"]
markers = [
  "network: needs network (skipped unless --run-network is passed)",
  "model: needs a real GGUF model on disk (skipped unless --run-network is passed)",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/evidence/ holds captured third-party artifacts (e.g. the operator's PoC). Frozen
# evidence, not our code: it is pinned by the oracle and never edited.
exclude = ["docs/evidence", "state", ".venv", "mutants", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# the oracle mirrors reference implementations in one long, readable script
"docs/verify_runtime_contract.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mutmut]
# Mutation testing (Tier M). `source_paths` lists the *files under mutation*; `also_copy` brings
# the rest of the package (plus tests/docs/tools) into the mutants tree verbatim, so the copied
# package still imports while only those files carry mutants. Swap the pair for a wider sweep —
# e.g. source_paths = ["src/ggufone"] with also_copy = ["tests", ...] — when a milestone wants
# the whole package (E1a/E1b did: readout + schema).
# Card t_8cb0a05e (E1c FIX) swept `source_paths = ["src/ggufone/runtime/fit.py"]` with
# [tests/test_fit.py, tests/test_fit_free_vram.py, tests/test_fit_oom_recovery.py] and
# max_children = 2 (the fast set, so a sweep finishes inside the shared pid cap).
# Card t_858c54d1 (E2) retargets the pair below at the bench package with the bench gates.
# Card t_630f32a3 (E2.5) swept `source_paths = ["src/ggufone/calibration"]` with both calibration
# gate files and max_children = 3 (3 crashed the container's pid cap at 1726/2728 mutants; the
# completed sweep ran with 2, which is what stays here). Card t_e29734e6 (E1c FIX) is a
# *test-only* change (no production line moved), so its sweep was the fit pair again —
# time-boxed on a box shared with a sibling benchmark, so the score is reported with its not-run
# count, never as a full-sweep number. Card t_603a35a0 (E2 FIX, backend attribution) swept the
# new parser alone — src/ggufone/runtime/devices.py with tests/test_bench_attribution.py —
# because that module *is* the fix's evidence rule and the bench gates are too slow to run per
# mutant on this shared box. Card t_dd62ec29 (E2 FIX, the mixed-bundle teardown abort) swept
# src/ggufone/bench/isolation.py with tests/test_bench_isolation.py, because that module is the
# whole remedy (the suites only call into it) and its gate file is fast. Restore a
# bench/fit/resolver sweep by swapping both lines back.
# Card t_a431be85 (E3) swept `source_paths = ["src/ggufone/bench/compare.py"]` with
# [tests/test_e3.py] — the module E3 adds (align / merge_reports / model_row / render_comparison);
# its gate file is fast and drives every branch of it, which is what a Tier-M sweep needs on a box
# shared with a sibling bench. Card t_57cc0179 (E2 FIX, the teardown crash's recovery) took
# `source_paths` to `src/ggufone/bench/isolation.py` with both of that module's gate files (see the
# test-selection comment below); card t_6952f0dd (E3b, the label policy) is the current sweep and
# mutates `src/ggufone/bench/labels.py` — a later sweep restores the isolation pair.
# Card t_6c119626 (E3c, the cue verdict + the shape probe) takes the pair to the module the change
# adds: `src/ggufone/engine/cue.py` — the refusal rule (`cue_verdict`, `single_token_closers`,
# `closer_mass`) that `decide.py` and the report both call — with the card's two gate files. The
# doc gate in test_e3c_cue_refused.py reads the same module's closer vocabulary, so it is part of
# the selection. Restore the bench pair above when a bench card sweeps next.
# Card t_6de5fc53 (the bench/product prompt-parity fix) takes `source_paths` to the module the fix
# moves: `src/ggufone/bench/harness.py` — `LiveModel.decide` plans once from the handle now, and
# `framing_label` / `framing_line` / `prefix_tokens_of` / `device_cell` / `evidence_line` carry the
# framing into every row and into the rendered report. `suites.py` is deliberately *not* added: its
# change is three dict entries that the same gate nodes read, while mutating the whole module would
# multiply the sweep by suite bodies the parity pair never reaches.
# Card t_4c48f40a (E3e, the question's placement + the instructed JSON) is the current sweep. It
# takes `source_paths` to the two modules the card's *prompt* half lives in: `engine/prompt.py`
# (the role split, the two framings, the contract lines, the acceptance) and `engine/cue.py` (the
# value row's verdict vocabulary: `value_markers`, `value_verdict`). The card's gate files are the
# selection — `tests/test_e3e_roles.py` drives every new branch (including the model-marked family
# checks, which skip without `--run-network` and therefore do not slow the sweep), the E3d pin file
# keeps the frozen cue bytes honest, and the E3c doc gate reads the same closer vocabulary that
# `value_verdict` composes. **Deliberately not swept: `engine/decide.py`** — the value-row walk
# (`_score_group`, the one-token continuation, the two new warnings) is gated by the same file, but
# decide.py is 44 KB of engine the E3e change touches in one method, and mutating it would multiply
# the sweep by every wave/coverage/readout branch the E3e gates never reach on this shared box. A
# later card that adds an engine-shaped change restores a decide.py sweep.
# Card t_c8c76cc8 (E3e audit, F1-F4 applied verbatim) moves the pair to the *tool* the findings live
# in: `tools/e3e_roles_decision.py` — the freeze check's compared field set (F1, `cue.refused`) and
# `decide()`'s fallback verdict (F2). Its own gate file is the whole selection;
# `tests/test_e3e_docs.py` is deliberately out (its pins are prose, and a doc edit cannot kill a
# mutant). Restore the engine pair above when an engine card sweeps next.
# The sweep: 1941 mutants, two rounds against the same source (the change, then the pin round 1's
# survivors named). Round 1: 1404 killed / 537 survived (72.3 %) — the F1 hunk 22/22 killed, the F2
# hunk 12 killed / 2 survived (the new branches' verdict dict `label` key, which nothing rendered).
# Round 2 adds `test_the_report_prints_the_new_fallback_wording`: 1412 killed / 529 survived
# (72.7 %), F1 22/22 and F2 14/14 killed. The two survivors on the changed surface are casing
# mutants of the F3 caveat literal (prose; the note's `1.96` content is pinned). Receipts:
# `.e3e/logs/f1_f4_patches.txt`, `.e3e/logs/mutmut_f1f4.log`, `.e3e/mutmut_f1f4_triage.txt`.
# `tests/test_e3e_roles_decision.py` had to load the tool under its path-derived name for any of
# this to run — mutmut keys a trampoline by the path, not by a bare module name (see `_tool()`).
source_paths = ["tools/e3e_roles_decision.py"]
also_copy = ["src/ggufone", "tests", "docs", "tools", "runtime.lock", "pyproject.toml", "README.md",
             "SPEC.md", "LICENSE"]
pytest_add_cli_args = ["-q", "--timeout=120", "-p", "no:randomly"]
# E1c FIX (card t_8cb0a05e) used [tests/test_fit.py, tests/test_fit_free_vram.py,
# tests/test_fit_oom_recovery.py] with max_children = 2 (the fast set, so a sweep can finish
# inside this container's shared pid cap). E2 (card t_858c54d1) mutates the bench package, whose
# gate files are tests/test_bench.py (the suite/report contract), tests/test_bench_placement.py
# (card t_31b3943a: the bench<->loader seam) and tests/test_bench_quick.py (card t_f46cec41: the
# `--quick` preset, the soft cap and report integrity — a CLI-level test cannot kill a bench
# mutant: it drives a different module). E2.5 (card t_630f32a3) mutates the calibration package:
# both of its gate files are the selection (test_calibration.py drives the math/fit/store/CLI,
# test_routing.py the router and the escalation policy). Card t_e29734e6 (E1c FIX, test-only)
# swept the fit files again. Card t_603a35a0 (E2 FIX, backend attribution) swept
# src/ggufone/runtime/devices.py with tests/test_bench_attribution.py. Card t_dd62ec29 (E2 FIX,
# mixed-bundle teardown) swept that module with tests/test_bench_isolation.py. Card t_a431be85 (E3)
# activated `["src/ggufone/bench/compare.py"]` + `["tests/test_e3.py"]` while it landed; card
# t_57cc0179 (E2 FIX, the teardown crash's recovery) is the most recent sweep and puts the pair back
# on the module it changes — `src/ggufone/bench/isolation.py` with **both** isolation gate files
# (test_bench_isolation.py = the containment, test_bench_teardown_crash.py = the retry, the warning
# and the table): the retry lives inside `run_backend_child`, whose mutants only the pair together
# kill. A bench sweep only has to restore the three bench gate files above; an E3 sweep restores
# `compare.py` + `test_e3.py`. Card t_6952f0dd (E3b, the `qwen35moe` label policy) activates
# `["src/ggufone/bench/labels.py"]` + `["tests/test_e3b_labels.py"]`; a later sweep restores this
# Card t_d90404ac (E3d, the cue shapes + the `--cue` switch) moves the pair to the module the change
# rewrites — `src/ggufone/engine/prompt.py`: `build_question(cue=...)` renders `two_step`
# byte-for-byte the same suffix and `json_field` as the cue line plus the per-type opener, and the
# byte-identity is exactly the mutant only the card's own gate file kills
# (tests/test_e3d_cue_switch.py, with the template/framing gates and the E1c pins beside it).
#
# The sweep: 149 mutants, **74 killed / 50 survived / 25 no-tests**, 0 timeouts. The survivors are
# the module's pre-existing branches (the descriptions/readout paths of `build_question`) that this
# selection does not drive, and the no-tests block is `empty_candidate_code`, whose gates live in
# the CLI suites. Widening the selection to `tests/test_e3b_labels.py` + `tests/test_scaffold.py`
# to reach them is *recorded as attempted and not achieved*: on mutmut 3.8 that run reported the
# mutant phase as passing-without-failing (0 killed / 50 survived) rather than aborting, i.e. the
# tests no longer saw the mutations at all. The trigger was an environment one, not the selection:
# `uv run --with mutmut` re-syncs the project venv, and without `--extra dev` that drops pytest, so
# the baseline run dies (every mutant reads "not checked"); after `uv sync --frozen --extra dev`
# restores it, the same 149 mutants all read "survived", which is why the driver carries `--extra
# dev` now and why the numbers above are the only ones this card stands behind. A later sweep should
# rebuild the venv the way this run had it before widening the selection. The
# cue-verdict pair above (cue.py + the three e3c gate files) stays valid for the module it names;
# restore it when a cue-verdict card sweeps next.
# isolation pair. Card t_635124bf (E3c FIX, the cue verdict classifies the vocabulary) keeps
# `source_paths` on the same module — it is the file the fix moves — and adds the card's own gate
# file to the selection: the map's fallbacks (`<special <id>>`, the catalogue winning a collision,
# the session that cannot enumerate) and the dominance floor live only in
# `tests/test_e3c_cue_specials.py`, so a two-file selection would leave those mutants alive.
# Card t_6de5fc53: the parity gate the fix exists for, plus the five `tests/test_bench.py` nodes
# that drive the changed helpers (the quality rows, the renderer's framing line and the table
# integrity). The other bench gates spawn real files, sessions or models and cannot run per mutant
# on this shared box.
# Card t_c8c76cc8 (E3e audit F1-F4) selects the tool's own gate file: it drives the freeze check's
# field set and every branch of the new verdict wording, and it is fast enough to run per mutant.
pytest_add_cli_args_test_selection = [
    "tests/test_e3e_roles_decision.py",
]
# NOT read by mutmut 3.8 (it is a CLI-only option: `mutmut run --max-children 2`), and a sweep on
# this box needs both the flag and a retry driver: a failed `os.fork()` takes the whole run down
# with `BlockingIOError: [Errno 11]`. `.e2e/t_57cc0179-vulkan-teardown/mutmut_sweep.sh` does both.
