# fast contract file `tests/test_fit.py` — the live file needs the model and cannot run per mutant.
# A later sweep restores the keep pair above.
pytest_add_cli_args_test_selection = [
    "tests/test_runtime_update.py",
]
# NOT read by mutmut 3.8 (it is a CLI-only option: `mutmut run --max-children 2`), and a sweep on
# this box needs both the flag and a retry driver: a failed `os.fork()` takes the whole run down
# with `BlockingIOError: [Errno 11]`. `docs/evidence/e2e/t_57cc0179-vulkan-teardown/mutmut_sweep.sh` does both.
